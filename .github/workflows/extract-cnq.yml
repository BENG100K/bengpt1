name: Extract CNQ notaires

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run extraction
        run: |
          python extract_notaires_cnq.py --city "Lévis" --radius 50 --output notaires_cnq.csv

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notaires-cnq
          path: |
            notaires_cnq.csv
            debug-cnq.png
            debug-cnq.html
          if-no-files-found: warn
