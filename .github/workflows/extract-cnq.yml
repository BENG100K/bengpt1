name: Extract CNQ notaires

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test CNQ with curl
        continue-on-error: true
        run: |
          set -x
          curl -sS -D curl-headers.txt -o curl-body.html \
            -L --max-time 45 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: fr-CA,fr;q=0.9,en;q=0.7" \
            -H "Cache-Control: no-cache" \
            -w "\nHTTP_CODE=%{http_code}\nFINAL_URL=%{url_effective}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\n" \
            https://trouverunnotaire.cnq.org/ | tee curl-summary.txt
          head -n 80 curl-headers.txt || true
          head -n 80 curl-body.html || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run extraction
        continue-on-error: true
        run: |
          python extract_notaires_cnq.py --city "Lévis" --radius 50 --output notaires_cnq.csv

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notaires-cnq
          path: |
            notaires_cnq.csv
            debug-cnq.png
            debug-cnq.html
            curl-headers.txt
            curl-body.html
            curl-summary.txt
          if-no-files-found: warn
